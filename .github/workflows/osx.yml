name: macOS x64 Vulkan static
on: [push]

jobs:
  build:
    uses: ./.github/workflows/_build.yml
    with:
      name: macOS x64 Vulkan static
      runner: macos-26-intel
      os: macos
      build_flags: '-o cliGraphics=False'
      python_cmd: python
      setup_python: true
      python_version: '3.10'
      # One per platform+arch: this is the Intel macOS job that gets a MoltenVK driver,
      # so the graphics suite actually runs instead of skipping for want of an ICD.
      vulkan_icd: true
      hook_name: macOS-x64-static
    secrets:
      WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
