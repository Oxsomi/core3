name: C/C++ CI

on: [push]

jobs:
  build:
    name: OSX build arm dynamic
    runs-on: macos-15
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - name: Install Vulkan SDK
      uses: humbletim/install-vulkan-sdk@main
      with:
        cache: true
        version: 1.3.290.0
    - uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - name: Install Conan
      id: conan
      uses: turtlebrowser/get-conan@main
    - name: Configure conan
      run: conan profile detect
    - name: Set up Homebrew
      id: set-up-homebrew
      uses: Homebrew/actions/setup-homebrew@master
    - name: Ensure we can run llvm-objcopy
      run: brew install llvm
    - name: Add llvm-objcopy to path
      run: export PATH="/opt/homebrew/opt/llvm/bin:$PATH"
    - name: Restore cached
      id: cache-restore
      uses: actions/cache/restore@v4
      with:
        path: ~/.conan2/p
        key: ${{ runner.os }}-arm64-${{ hashFiles('**/packages') }}
    - name: Release dynamic but no SIMD, not supported yet
      run: bash build.sh Release False True True -o cliGraphics=False
    - name: Debug dynamic but no SIMD, not supported yet
      run: bash build.sh Debug False True True -o cliGraphics=False
    - name: Delete non package files for cache
      run: rm -rf ~/.conan2/p/b/*/b
    - name: Cache Build
      id: cache-build
      uses: actions/cache/save@v4
      with:
        path: ~/.conan2/p
        key: ${{ runner.os }}-arm64-${{ hashFiles('**/packages') }}
    - uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.3'
        bundler-cache: true
    - name: Send Webhook Notification
      if: always()
      env:
        JOB_STATUS: ${{ job.status }}
        WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
        HOOK_OS_NAME: ${{ runner.os }}-arm64-dynamic
        WORKFLOW_NAME: ${{ github.workflow }}
      run: |
        git clone https://github.com/DiscordHooks/github-actions-discord-webhook.git webhook
        bash webhook/send.sh $JOB_STATUS $WEBHOOK_URL
      shell: bash