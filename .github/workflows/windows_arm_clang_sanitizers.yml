name: Windows ARM64 D3D12+Vulkan dynamic (clang-cl, ASan + UBSan)

# Completes the sanitizer matrix: with this job every platform we ship is sanitized on both architectures.
#
# Nightly rather than per push for the same reason as the other sanitizer jobs, see
# linux_clang_sanitizers.yml.
#
# This is the one sanitizer job whose toolchain support is not established. LLVM supports ASan on Windows
# aarch64, but whether the runner's toolchain ships the prebuilt clang_rt.*-aarch64.lib runtimes is a
# property of that particular installer. CMakeLists checks for them during configure and fails naming the
# arch and listing what the toolchain does have, so if they are absent this job says so in one legible
# error instead of thousands of unresolved symbols. If it turns out they aren't shipped, the options are
# building compiler-rt for the runner or dropping back to UBSan alone.

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  build:
    uses: ./.github/workflows/_build.yml
    with:
      name: Windows ARM64 D3D12+Vulkan dynamic (clang-cl, ASan + UBSan)
      runner: windows-11-arm
      os: windows
      # -dynamic_linking is what actually gets both backends: per src/graphics/CMakeLists.txt only the
      # DynamicLinkingGraphics branch enables D3D12 and Vulkan together, and dropping forceVulkan on its
      # own would have selected D3D12 only.
      build_flags: '-compiler clang -dynamic_linking True -o cliGraphics=False -asan True -ubsan True'
      # Its own cache group: sanitized dependencies are distinct conan packages from the plain clang-cl job's.
      cache_name: clang_sanitizers
      python_cmd: python
      setup_python: true
      python_version: '3.13'
      sanitizers: true
      hook_name: Windows-arm64-clang-sanitizers
    secrets:
      WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
