name: Windows ARM64 D3D12+Vulkan dynamic
on: [push]

jobs:
  build:
    uses: ./.github/workflows/_build.yml
    with:
      name: Windows ARM64 D3D12+Vulkan dynamic
      runner: windows-11-arm
      os: windows
      vulkan: true
      build_flags: '-dynamic_linking True -o forceVulkan=True -o cliGraphics=False'
      python_cmd: python
      setup_python: true
      python_version: '3.13'
      hook_name: Windows-arm64-dynamic
    secrets:
      WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
