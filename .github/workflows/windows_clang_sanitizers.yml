name: Windows x64 D3D12+Vulkan dynamic (clang-cl, ASan + UBSan)

# Nightly companion to the linux clang sanitizer job, see linux_clang_sanitizers.yml for why these aren't
# in the per commit matrix.
#
# Worth having on top of linux because it is the only sanitized job that exercises the Windows code paths:
# the win32 platform layer, and (unlike the linux jobs) a real D3D12 device via WARP.
#
# x64 only. There is no arm64 companion because the windows-11-arm runner's LLVM ships no aarch64 sanitizer
# runtimes (clang_rt.asan_dynamic-aarch64 and friends), which CMakeLists checks for and reports at configure
# time. MSVC stays unsanitized on purpose, its sanitizers aren't trusted here.

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

jobs:
  build:
    uses: ./.github/workflows/_build.yml
    with:
      name: Windows x64 D3D12+Vulkan dynamic (clang-cl, ASan + UBSan)
      runner: windows-2022
      os: windows
      # -dynamic_linking is what actually gets both backends: per src/graphics/CMakeLists.txt only the
      # DynamicLinkingGraphics branch enables D3D12 and Vulkan together. Dropping forceVulkan on its own
      # would have selected D3D12 only, sanitizing half of what we wanted.
      # It also suits ASan here: the dynamic sanitizer runtime is already required because the shader
      # compiler is a DLL, and more backend DLLs change nothing about that.
      build_flags: '-compiler clang -dynamic_linking True -asan True -ubsan True'
      # Its own cache group: sanitized dependencies are distinct conan packages from the plain clang-cl job's.
      cache_name: clang_sanitizers
      python_cmd: python
      setup_python: false
      python_version: ''
      sanitizers: true
      hook_name: Windows-x64-clang-sanitizers
    secrets:
      WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
