name: Nightly

# Starts every sanitizer workflow and the dependency watch together, at 05:00 Amsterdam time.
#
# GitHub's own schedule runs hours late, so the start comes from an outside clock.
# It needs a fine grained token with Actions: write on this repository, and makes one call:
#
#   gh workflow run nightly.yml -R Oxsomi/core3
#   POST https://api.github.com/repos/Oxsomi/core3/actions/workflows/nightly.yml/dispatches with {"ref":"main"}
#
# The cron below is the fallback for a night the clock misses, and skips once today's round has started.
# A round started by hand always runs.

on:
  schedule:
    - cron: '37 5 * * *'
      timezone: "Europe/Amsterdam"
  workflow_dispatch:

permissions:
  actions: write

jobs:
  round:
    runs-on: ubuntu-latest
    steps:
      - name: Start the round
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          RUN_ID: ${{ github.run_id }}
        run: |
          # Today's round has started if an earlier run of this workflow on this branch, from today (UTC),
          # is going or succeeded.
          # If the check itself fails, start anyway: a doubled round costs less than a missed one.
          if [ "$EVENT_NAME" = "schedule" ]; then
            earlier="[.[] | select(.databaseId < $RUN_ID and (.status != \"completed\" or .conclusion == \"success\"))]"
            started=$(gh run list --workflow nightly.yml --branch "$REF_NAME" --created ">=$(date -u +%F)" --limit 100 \
              --json databaseId,status,conclusion --jq "$earlier | length") || started=0
            if [ "$started" != "0" ]; then
              echo "Today's round already started, so the schedule has nothing to add."
              exit 0
            fi
          fi

          # Try every workflow, so one refused dispatch doesn't stop the rest.
          # The round has started once any of them went out, so only a round that sent nothing fails.
          sent=0
          for workflow in \
            linux_clang_sanitizers windows_clang_sanitizers osx_arm_sanitizers linux_arm_clang_sanitizers \
            osx_clang_sanitizers linux_gcc_sanitizers android_sanitizers web_sanitizers deps_watch
          do
            for attempt in 1 2 3; do
              if gh workflow run "$workflow.yml" --ref "$REF_NAME"; then
                sent=$((sent + 1))
                continue 2
              fi
              [ "$attempt" -lt 3 ] && sleep $((attempt * 15))
            done
            echo "::error::$workflow.yml could not be dispatched"
          done
          [ "$sent" -gt 0 ]
