name: C/C++ CI

on: [push]

jobs:
  build:
    name: Windows build arm
    runs-on: windows-11-arm
    env:
      VULKAN_SDK: C:\VulkanSDK\
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - name: Set up Visual Studio Build Tools
      run: choco install visualstudio2022buildtools --package-parameters "--add Microsoft.VisualStudio.Workload.NativeDesktop --includeRecommended"
    - uses: actions/setup-python@v5
      with:
        python-version: '3.13' 
    - name: Install Vulkan SDK
      uses: humbletim/install-vulkan-sdk@main
      with:
        cache: true
    - name: Install Conan
      id: conan
      uses: turtlebrowser/get-conan@main
    - name: Configure conan
      run: conan profile detect
    - name: Restore cached
      id: cache-restore
      uses: actions/cache/restore@v4
      with:
        path: ~/.conan2/p
        key: ${{ runner.os }}-arm64-${{ hashFiles('**/packages') }}
    - name: build for fast check
      run: cmd /C build.bat Release False True False -o cliGraphics=False -o forceVulkan=True
    - name: build for debug check
      run: cmd /C build.bat Debug False True False -o cliGraphics=False -o forceVulkan=True
    - name: Delete non package files for cache
      run: bash -c "rm -rf ~/.conan2/p/b/*/b"
    - name: Cache Build
      id: cache-build
      uses: actions/cache/save@v4
      with:
        path: ~/.conan2/p
        key: ${{ runner.os }}-arm64-${{ hashFiles('**/packages') }}
    - uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.3'
        bundler-cache: true
    - name: Send Webhook Notification
      if: always()
      env:
        JOB_STATUS: ${{ job.status }}
        WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
        HOOK_OS_NAME: ${{ runner.os }}-arm64-vk-static
        WORKFLOW_NAME: ${{ github.workflow }}
      run: |
        git clone https://github.com/DiscordHooks/github-actions-discord-webhook.git webhook
        bash webhook/send.sh $JOB_STATUS $WEBHOOK_URL
      shell: bash