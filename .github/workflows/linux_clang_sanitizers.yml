name: Linux x64 Vulkan static (clang, ASan + UBSan)

# Nightly rather than per push: a sanitized build is roughly 2x slower to run and rebuilds its
# dependencies under their own conan package ids, so it doesn't belong in the per commit matrix.
#
# This is the job that catches the memory bugs the ordinary matrix structurally cannot: a use after free
# or an overrun only fails elsewhere when the freed page happens to be unmapped, which is why one shipped
# for days looking green everywhere except linux arm64.
# EnableASAN/EnableUBSAN have existed in CMakeLists.txt for a while; nothing was running them.
#
# Clang only, deliberately: MSVC's sanitizers aren't trusted here (see the note in CMakeLists.txt), and an
# unreliable sanitizer is worse than none because a clean run reads as proof that nothing is wrong.

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  build:
    uses: ./.github/workflows/_build.yml
    with:
      name: Linux x64 Vulkan static (clang, ASan + UBSan)
      runner: ubuntu-latest
      os: linux
      build_flags: '-compiler clang -o cliGraphics=False -asan True -ubsan True'
      # Its own cache group: sanitized dependencies are different packages than the plain clang job's,
      # so sharing that job's cache would miss everything and then never save its own.
      cache_name: clang_sanitizers
      python_cmd: python3
      setup_python: false
      python_version: ''
      sanitizers: true
      hook_name: Linux-x64-static-clang-sanitizers
    secrets:
      WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
