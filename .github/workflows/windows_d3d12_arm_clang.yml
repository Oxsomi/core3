name: Windows ARM64 D3D12 static (clang-cl)
on: [push]

# arm64 plus d3d12 plus clang; each of those is covered elsewhere, their combination isn't.

jobs:
  build:
    uses: ./.github/workflows/_build.yml
    with:
      name: Windows ARM64 D3D12 static (clang-cl)
      runner: windows-11-arm
      os: windows
      build_flags: '-compiler clang -o cliGraphics=False'
      python_cmd: python
      setup_python: true
      python_version: '3.13'
      hook_name: Windows-arm64-d3d12-static-clang
    secrets:
      WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
