name: Linux ARM64 Vulkan static (clang, ASan + UBSan)

# The most useful sanitized job we have: linux arm64 is where the shader packager segfaults inside
# SPIRV-Reflect while every x64 host stays green, so this is the one configuration that can turn that
# into an ASan report naming the allocation, the access and both stacks instead of a bare stacktrace.
#
# Nightly rather than per push for the same reason as the other sanitizer jobs, see
# linux_clang_sanitizers.yml.

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  build:
    uses: ./.github/workflows/_build.yml
    with:
      name: Linux ARM64 Vulkan static (clang, ASan + UBSan)
      runner: ubuntu-24.04-arm
      os: linux
      build_flags: '-compiler clang -asan True -ubsan True'
      # Its own cache group: sanitized dependencies are distinct conan packages, and arm64 can't share x64's.
      cache_name: clang_sanitizers
      python_cmd: python3
      setup_python: false
      python_version: ''
      # A sanitizer run without a driver skips every device test and still goes green, which is the
      # worst outcome: graphics is where the allocators, descriptor tables and command buffers live.
      vulkan_icd: true
      sanitizers: true
      hook_name: Linux-arm64-static-clang-sanitizers
    secrets:
      WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
