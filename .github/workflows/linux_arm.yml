name: Linux ARM64 Vulkan static
on: [push]

jobs:
  build:
    uses: ./.github/workflows/_build.yml
    with:
      name: Linux ARM64 Vulkan static
      runner: ubuntu-24.04-arm
      os: linux
      build_flags: '-o cliGraphics=False'
      # arm64 Vulkan device coverage, which CI has nowhere else.
      # The one-job restriction noted in linux.yml is about eight identical x64 jobs, so it doesn't
      # apply to a different architecture.
      vulkan_icd: true
      python_cmd: python3
      setup_python: false
      python_version: ''
      hook_name: Linux-arm64-static
    secrets:
      WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
